[package]
name = "blocklauncher-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Version library, APK inspection and native-mod handling for BlockLauncher-Re"
license = "MIT OR Apache-2.0"

[lib]
name = "blre_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Everything here is pure Rust. The Android side links this crate through
# `staticlib`, so a C dependency would mean cross-compiling it with the NDK for
# four ABIs; these four crates need no toolchain beyond rustc.
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Pure Rust JavaScript engine: the Android build already cross-compiles this
# crate for four ABIs, and adding a C engine would mean cross-compiling that too.
boa_engine = "0.22"

# Only the Android library needs the JNI types; the host build (tests, the
# `inspect` example) must stay buildable with nothing but rustc, which is what
# lets the interesting code be tested off-device.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
default = []

# The APK carries one copy of this library per ABI and the JavaScript engine is
# most of it, so release is tuned for size in the parts that cost nothing at
# runtime:
#
#   lto            the engine's generics are instantiated once after inlining
#                  instead of in every codegen unit that touches them
#   codegen-units  one unit is what gives LTO a whole crate to work with
#   panic = abort  `extern "system"` already aborts on unwind, so the tables
#                  that exist to support an unwind that can never happen are
#                  dead weight; a Rust panic still takes the app down, which is
#                  the failure mode the bridge's contract already assumed
#   strip          drops the static symbol table (74k entries on arm64); the
#                  dynamic one, which is what JNI lookup uses, is untouched
#
# `opt-level` stays at the default 3: this is a runtime others wait on, and
# trading its speed for a smaller download is the wrong trade.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
