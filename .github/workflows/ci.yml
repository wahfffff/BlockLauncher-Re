name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The core has no C dependencies, so this is all the toolchain it needs.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --locked is deliberate: it fails when Cargo.lock does not match
      # Cargo.toml, which is exactly what happens when a dependency is added for
      # one target and the lock is not regenerated. Better here than on a device.
      - name: Test
        working-directory: core
        run: cargo test --locked --all-targets

      - name: Build release
        working-directory: core
        run: cargo build --release --locked

      # The example exists so the binary readers can be pointed at a real APK by
      # hand; here it only has to run and reject a non-APK cleanly.
      - name: Example rejects a non-APK
        working-directory: core
        run: |
          set +e
          cargo run --quiet --example inspect -- README.md
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "inspect accepted a Markdown file as an APK"
            exit 1
          fi
          echo "ok - rejected with exit $code"

  android:
    name: android (apk)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The runner image ships the SDK here. Pointing at it explicitly beats
      # letting a setup action discover it, because the action also insists on
      # installing the legacy `tools` package, which no longer exists and aborts
      # the whole run before anything is built.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          set -e
          sdkm="$(command -v sdkmanager || true)"
          if [ -z "$sdkm" ]; then
            sdkm="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -n 1)"
          fi
          echo "sdkmanager: $sdkm"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "--- installed NDK ---"
          ls "$ANDROID_HOME/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      # cargo-ndk is the only thing that knows where the NDK keeps its linkers
      # for each ABI; without it every target needs three env vars set by hand.
      - name: Install cargo-ndk
        run: command -v cargo-ndk > /dev/null || cargo install cargo-ndk --locked

      # Builds libblre_core.so into the packaging directory the APK reads from, so
      # the Gradle step that follows has nothing to copy or discover.
      #
      # Run from `core/`: cargo-ndk shells out to `cargo metadata` before it
      # applies any --manifest-path, so from the repository root it fails with
      # "could not find Cargo.toml" before a single file is compiled.
      - name: Build the Rust core for Android
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          cargo ndk \
            --platform 23 \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../android/app/src/main/jniLibs \
            build --release --locked

          echo "--- jniLibs ---"
          find ../android/app/src/main/jniLibs -name '*.so' -exec ls -l {} \;

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # `assembleDebug` signs with ~/.android/debug.keystore, and Gradle creates
      # that file with a freshly generated random key whenever it is missing. On
      # a fresh runner that happens on every single build, which means every APK
      # is signed by a different key — and Android refuses to install one over an
      # app signed by another. Caching the file is what makes an update possible
      # instead of "app not installed, uninstall first".
      - name: Cache the debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Assemble the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Show the signing certificate
        run: |
          set -e
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile "$apk" | grep -E 'Owner|SHA256:' | head -2

      # "The build passed" is not the same claim as "the APK can start". The
      # first APK this project produced was green and empty, so the artifact is
      # inspected rather than trusted.
      - name: Verify the APK carries the core
        run: |
          set -e
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          ls -l "$apk"

          for abi in arm64-v8a armeabi-v7a; do
            if ! unzip -l "$apk" | grep -q "lib/$abi/libblre_core.so"; then
              echo "APK is missing lib/$abi/libblre_core.so - it would install and then fail at System.loadLibrary" >&2
              unzip -l "$apk" | head -40 >&2
              exit 1
            fi
            echo "ok - lib/$abi/libblre_core.so is packaged"
          done

          # The launcher's own classes have to be in there too; an APK with the
          # native library but no dex would also install and then do nothing.
          unzip -l "$apk" | grep -q 'classes.dex' || { echo "no classes.dex" >&2; exit 1; }
          echo "ok - classes.dex present"

      - uses: actions/upload-artifact@v4
        with:
          name: BlockLauncher-Re-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # An Actions artifact needs a login, expires, and arrives wrapped in a zip.
      # The summary is what a person can act on straight after a build: which
      # commit, how big, and the hash to compare against.
      - name: Summarise
        run: |
          set -e
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          size=$(stat -c %s "$apk")
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          {
            echo "### BlockLauncher-Re debug APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| size | ${size} bytes |"
            echo "| sha256 | ${sha} |"
            echo "| ABIs | arm64-v8a, armeabi-v7a |"
            echo ""
            echo "Attached to this run as BlockLauncher-Re-debug."
            echo "A tag also publishes it as a release asset, without the zip wrapper."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish (release apk)
    runs-on: ubuntu-latest
    needs: android
    # Only a tag publishes. A release is a claim that this exact commit was
    # built; re-publishing "latest" on every push makes the claim meaningless.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BlockLauncher-Re-debug
          path: out

      - name: Name the asset after the tag
        run: |
          set -e
          version="${GITHUB_REF#refs/tags/v}"
          test -n "$version"
          mv out/app-debug.apk "out/BlockLauncher-Re-${version}-debug.apk"
          cd out && sha256sum ./*.apk > SHA256SUMS
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out, so `gh` has no git remote to infer the
          # repository from and dies with "not a git repository" before it
          # reaches the API. Naming the repository is cheaper than a checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/}"
          cat > notes.md <<'NOTES'
          A debug build, signed with the Android debug key. Installing it needs
          "install unknown apps" enabled; this is not a Play-ready release.

          What it does today: import a game APK you already have, list it with
          its package, version, ABIs and SHA-256, and delete it again. It does
          not start the game yet.
          NOTES

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* \
              --title "BlockLauncher-Re $tag" \
              --notes-file notes.md
          fi

          gh release view "$tag" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
